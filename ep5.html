<style>*{box-sizing:border-box}

<script>window.EP={name:'실어증 2편',sub:'평가 · 예후 · 치료',next:'ep6.html'};</script>
<script>"use strict";
window.EP=window.EP||{name:'해부 1편',sub:'뇌의 구조'};
/* ───────── 공용 도구 ───────── */
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=cl(x);return x*x*(3-2*x)};
const ramp=(t,a,b)=>sm((t-a)/(b-a));
const win=(t,a,b,f=0.5)=>Math.min(ramp(t,a,a+f),1-ramp(t,b-f,b));
const lerp=(a,b,k)=>a+(b-a)*k;
const op=(e,v)=>{if(e)e.style.opacity=(+v).toFixed(3);};
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function hdiv(cls,html,parent,style){const e=document.createElement('div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)e.style.cssText=style;if(parent)parent.appendChild(e);return e;}
function smoothPath(pts,closed){const n=pts.length;let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;const P=i=>closed?pts[(i+n)%n]:pts[cl(i,0,n-1)];
 const m=closed?n:n-1;for(let i=0;i<m;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
  d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
 return d+(closed?'Z':'');}
/* 매끈한 윤곽선을 이랑처럼 물결치게 */
const WAVYC={};
function wavy(d,amp,waves,N=520){const _k=d+'|'+amp+'|'+waves+'|'+N;if(WAVYC[_k])return WAVYC[_k];return WAVYC[_k]=_wavy(d,amp,waves,N);}
function _wavy(d,amp,waves,N){const p=sv('path',{d},$('measure'));const L=p.getTotalLength();const P=[];for(let i=0;i<N;i++)P.push(p.getPointAtLength(L*i/N));
 let s='';for(let i=0;i<N;i++){const a=P[(i-1+N)%N],b=P[(i+1)%N];let nx=b.y-a.y,ny=-(b.x-a.x);const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
  const w=amp*(Math.sin(i/N*2*Math.PI*waves)+0.25*Math.sin(i/N*2*Math.PI*waves*1.7+1.7));s+=(i?'L':'M')+(P[i].x+nx*w).toFixed(1)+','+(P[i].y+ny*w).toFixed(1);}
 p.remove();return s+'Z';}
/* 경로를 따라 자라는 선 */
function grow(path,p){const L=path.__L||(path.__L=path.getTotalLength());path.style.strokeDasharray=L;path.style.strokeDashoffset=L*(1-cl(p));path.style.opacity=p>0?1:0;}
function ptOn(path,u){const L=path.__L||(path.__L=path.getTotalLength());return path.getPointAtLength(L*cl(u));}

/* ───────── 페이지·타임라인 ───────── */
const PAGES=[];const ALL=[];let TOTAL=0;
const DUR={};   // 실제 음성 길이(초). 음성이 있는 줄만 기록
const est=tx=>{const n=tx.replace(/[\s,.?!·~()]/g,'').length;return Math.max(1.6,n*0.172+0.3);};
function page(def){PAGES.push(def);return def;}
function buildTimeline(){let T=0;
 for(const p of PAGES){p.t0=T;let n=0;const first=p===PAGES[0];
  for(const s of p.scenes){s.t0=T;T+=(s===p.scenes[0]&&!first)?Math.min(s.pre||0,0.9):(s.pre||0);s.L=[];
   for(const raw of s.lines||[]){const o=typeof raw==='string'?{tx:raw}:raw;n++;
    const id=p.id+'_'+String(n).padStart(2,'0');const mute=!!(o.mute||p.mute);
    const d=o.d||(DUR[id]!=null?DUR[id]:est(o.tx));
    const l={id,tx:o.tx,t0:T,t1:T+d,mute,nosub:!!o.nosub,has:!mute&&DUR[id]!=null,src:'audio/'+id+'.mp3'};
    s.L.push(l);ALL.push(l);T+=d+(o.gap!=null?o.gap:0.4);}
   T+=(s===p.scenes[p.scenes.length-1]&&p!==PAGES[PAGES.length-1])?Math.min(s.post||0,1.2):(s.post||0);s.t1=T;}
  p.t1=T;}
 TOTAL=T;}

/* ───────── 화면 공용: 3D 이름표, 칩 ───────── */
const tagPool={};let tagFrame=0;
function tag3(key,obj,lp,text,off,cls,v){if(v<=0)return;let d=tagPool[key];
 if(!d){d=tagPool[key]={el:hdiv('t3',''),ln:sv('line',{stroke:'#cfe0f5','stroke-width':2}),dot:sv('circle',{r:5,fill:'#fff'})};$('tags').appendChild(d.el);$('lead').appendChild(d.ln);$('lead').appendChild(d.dot);}
 d.used=tagFrame;d.el.className='t3 '+(cls||'')+(off[0]<0?' l':'');if(d.el.textContent!==text)d.el.textContent=text;
 if(!lp)return;const w=W.tmp.copy(lp);if(d.mf!==tagFrame){obj.updateMatrixWorld(true);W.cam.updateMatrixWorld();d.mf=tagFrame;}obj.localToWorld(w);w.project(W.cam);
 const x=(w.x+1)*640,y=(1-w.y)*360,lx=x+off[0],ly=y+off[1];
 d.el.style.left=lx+'px';d.el.style.top=ly+'px';d.ln.setAttribute('x1',x);d.ln.setAttribute('y1',y);d.ln.setAttribute('x2',lx);d.ln.setAttribute('y2',ly);d.dot.setAttribute('cx',x);d.dot.setAttribute('cy',y);
 op(d.el,v);op(d.ln,v);op(d.dot,v);}
function endTags(){for(const k in tagPool){const d=tagPool[k];if(d.used!==tagFrame){op(d.el,0);op(d.ln,0);op(d.dot,0);}}}
let chipNow=null;
function chip(html,v){if(v>0)chipNow={html,v};}


/* 자막: 한 줄(최대 폭)에 맞게 쉼표·마침표 기준으로 나누기 */
const SUBW=1150,subCache={};let subCtx=null;
function subW(s){if(!subCtx){subCtx=document.createElement('canvas').getContext('2d');subCtx.font='600 27px "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';}return subCtx.measureText(s).width+36;}
function subChunks(tx){if(subCache[tx])return subCache[tx];const out=[];const push=s=>{s=s.trim();if(s)out.push(s);};
 const sents=tx.match(/[^.?!]+[.?!]+\s*|[^.?!]+$/g)||[tx];
 for(const sen of sents){if(subW(sen.trim())<=SUBW){push(sen);continue;}
  const cls=sen.match(/[^,]+,?\s*/g)||[sen];let cur='';
  for(const c of cls){const cand=cur+c;if(subW(cand.trim())<=SUBW){cur=cand;continue;}
   push(cur);cur='';if(subW(c.trim())<=SUBW){cur=c;continue;}
   let w='';for(const word of c.trim().split(' ')){const cw=w?w+' '+word:word;if(subW(cw)<=SUBW)w=cw;else{push(w);w=word;}}cur=w+' ';}
  push(cur);}
 return subCache[tx]=out.length?out:[tx];}
/* ───────── 프레임 ───────── */
const FX={gl:0};
function frame(t){
 tagFrame++;chipNow=null;FX.gl=0;W.reset();
 const cur=PAGES.find(p=>t>=p.t0&&t<p.t1)||PAGES[PAGES.length-1];if(typeof ensureInit==='function')ensureInit(cur);
 const last=PAGES[PAGES.length-1];
 for(const p of PAGES){if(p!==cur){if(p.layer.style.display!=='none')p.layer.style.display='none';continue;}
  p.layer.style.display='';op(p.layer,ramp(t,p.t0-0.01,p.t0+0.5)*(p===last?1:1-ramp(t,p.t1-0.3,p.t1)));
  p.draw(t,p);}
 // 3D
 W.cv.style.opacity=FX.gl.toFixed(3);if(FX.gl>0.001)W.R.render(W.scene,W.cam);
 endTags();
 // 칩
 const c=$('chip');const ch=chipNow?chipNow.html:'';if(c.dataset.v!==ch){c.dataset.v=ch;c.innerHTML=ch;}op(c,chipNow?chipNow.v:0);
 // 제목 카드
 const P0=PAGES[0];const tv=cur===P0?1-ramp(t,P0.t0+2.6,P0.t0+3.3):0;
 if($('titleNm').dataset.v!==P0.id){$('titleNm').dataset.v=P0.id;$('titleNm').textContent=(P0.label||P0.id)+' '+P0.title;}
 op($('title'),tv);
 // 코너 표시
 const sc=cur.scenes.find(s=>t>=s.t0&&t<s.t1)||cur.scenes[cur.scenes.length-1];
 const tg=`${EP.name} · <b>${cur.label||cur.id} ${cur.title}</b> · ${sc.name}`;if($('tag').dataset.v!==tg){$('tag').dataset.v=tg;$('tag').innerHTML=tg;}
 op($('tag'),cur===P0?ramp(t,P0.t0+2.6,P0.t0+3.2):1);$('scn').textContent=(cur.label||cur.id)+' · '+sc.name;

function ui(){$('fill').style.width=(t/TOTAL*100)+'%';$('knob').style.left=(t/TOTAL*100)+'%';$('time').textContent=fmt(t)+' / '+fmt(TOTAL);
 const bp=$('bplay'),st=playing?'pause':'play';if(bp.dataset.st!==st){bp.dataset.st=st;bp.innerHTML=playing?icoPause:icoPlay;}op($('bigplay'),playing||t>0.01?0:1);}
function setPlay(v){if(v&&t>=TOTAL-0.05)t=0;playing=v;last=performance.now();if(!v)stopAudio();else syncAudio();ui();showCtl();}
function seek(x){t=cl(x,0,TOTAL);stopAudio();frame(t);ui();if(playing)syncAudio();}
function flash(txt,left){const f=$('flash');f.textContent=txt;f.style.left=left?'80px':'';f.style.right=left?'':'80px';f.style.opacity=1;clearTimeout(flash.h);flash.h=setTimeout(()=>f.style.opacity=0,500);}
function loop(now){const dt=Math.min(0.5,(now-last)/1000);last=now;
 if(playing&&!dragging){
  if(curA&&!curA.a.paused&&curA.a.currentTime>0&&!curA.a.ended)t=curA.t0+curA.a.currentTime;else t+=dt*rate;
  if(t>=TOTAL){t=TOTAL;playing=false;stopAudio();if(EP.next){const n=$('nextEp');if(n)n.style.display='flex';}}
  syncAudio();frame(t);ui();}
 requestAnimationFrame(loop);}
for(const p of PAGES){for(const s of p.scenes){if(s.t0<=0)continue;const k=hdiv('tick'+(s===p.scenes[0]?' pg':''),'',$('ticks'));k.style.left=(s.t0/TOTAL*100)+'%';k.title=(p.label||p.id)+' '+s.name;}}
$('menu').innerHTML=PAGES.map((p,i)=>`<div data-i="${i}"><b>${p.label||p.id}</b>${p.title} <span style="color:#7d90ad;font-size:17px">${fmt(p.t0)}</span></div>`).join('');
$('menu').addEventListener('pointerup',e=>{e.stopPropagation();const d=e.target.closest('[data-i]');if(!d)return;seek(PAGES[+d.dataset.i].t0+0.01);$('menu').style.display='none';});
$('bmenu').onclick=()=>{const m=$('menu');m.style.display=m.style.display==='block'?'none':'block';showCtl();};
function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});}
$('bfull').onclick=toggleFull;
document.addEventListener('fullscreenchange',()=>{const ic=document.getElementById('icoFull');if(ic)ic.innerHTML=document.fullscreenElement?icoExit:icoFull;setTimeout(fit,100);});
$('bplay').onclick=()=>setPlay(!playing);
$('bback').onclick=()=>{seek(t-10);flash('◀◀ 10초',true);};
$('bfwd').onclick=()=>{seek(t+10);flash('10초 ▶▶',false);};
const prog=$('prog');const px=e=>{const r=prog.getBoundingClientRect();return cl((e.clientX-r.left)/r.width)*TOTAL;};
prog.addEventListener('pointerdown',e=>{dragging=true;CTL.classList.add('drag');wasPlaying=playing;playing=false;prog.setPointerCapture(e.pointerId);seek(px(e));});
prog.addEventListener('pointermove',e=>{if(dragging)seek(px(e));});
prog.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;CTL.classList.remove('drag');seek(px(e));setPlay(wasPlaying);});
const stage=$('stage');let tapT=0,tapH=null,pd=null,lastPage=null;
stage.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,yaw:W.ORB.yaw,pitch:W.ORB.pitch,drag:false};});
stage.addEventListener('pointermove',e=>{if(!pd||+W.cv.style.opacity<0.3)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(!pd.drag&&Math.hypot(dx,dy)>8)pd.drag=true;
 if(pd.drag){W.ORB.yaw=pd.yaw-dx*0.008;W.ORB.pitch=cl(pd.pitch+dy*0.006,-0.9,0.9);frame(t);}});
stage.addEventListener('pointerup',e=>{const wasDrag=pd&&pd.drag;pd=null;if(wasDrag)return;if($('menu').style.display==='block'){$('menu').style.display='none';return;}
 if(e.pointerType==='mouse'){setPlay(!playing);return;}
 const now=performance.now();const r=stage.getBoundingClientRect();const left=(e.clientX-r.left)<r.width/2;
 if(now-tapT<300){clearTimeout(tapH);tapT=0;if(left){seek(t-10);flash('◀◀ 10초',true);}else{seek(t+10);flash('10초 ▶▶',false);}return;}
 tapT=now;tapH=setTimeout(()=>setPlay(!playing),300);});
const VOICED=()=>ALL.filter(l=>!l.nosub);
function nextLine(d){const L=VOICED();if(d>0){const n=L.find(l=>l.t0>t+0.05);if(n)seek(n.t0);}else{const ps=L.filter(l=>l.t0<t-0.8);if(ps.length)seek(ps[ps.length-1].t0);else seek(0);}}
function setRate(r){rate=Math.round(cl(r,0.5,2)*100)/100;for(const l of ALL)if(l.a)l.a.playbackRate=rate;$('bspd').textContent=rate.toFixed(rate*10%1?2:1)+'×';flash('속도 '+rate+'×',false);}
const RATES=[0.5,0.75,0.9,1,1.1,1.25,1.5,1.75,2];
addEventListener('keydown',e=>{const k=e.key,c=e.code;if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(c==='Space'||k==='k'||k==='K'){e.preventDefault();setPlay(!playing);}
 else if(k==='j'||k==='J'||(e.shiftKey&&c==='ArrowLeft')){seek(t-10);flash('◀◀ 10초',true);}
 else if(k==='l'||k==='L'||(e.shiftKey&&c==='ArrowRight')){seek(t+10);flash('10초 ▶▶',false);}
 else if(c==='ArrowLeft'){nextLine(-1);flash('◀ 이전 대사',true);}
 else if(c==='ArrowRight'){nextLine(1);flash('다음 대사 ▶',false);}
 else if(/^[0-9]$/.test(k)){seek(TOTAL*(+k)/10);}
 else if(k==='<'||k===','){setRate(RATES[Math.max(0,RATES.findIndex(r=>r>=rate)-1)]);}
 else if(k==='>'||k==='.'){setRate(RATES[Math.min(RATES.length-1,RATES.findIndex(r=>r>rate))]||2);}
 else if(k==='r'||k==='R'){seek(0);setPlay(true);}
 else if(k==='Escape'){if($('menu').style.display==='block')$('menu').style.display='none';else location.href='index.html';}
 else if(k==='f'||k==='F'){toggleFull();}
 showCtl();});
$('bspd').onclick=()=>{const i=RATES.indexOf(rate);setRate(RATES[(i+1)%RATES.length]);};
$('bhome').onclick=()=>{location.href='index.html';};
function fit(){const vp=$('vp');const s=Math.min(vp.clientWidth/1280,vp.clientHeight/720);SCALE=s;stage.style.transform=`translate(-50%,-50%) scale(${s})`;W.R.setPixelRatio(Math.min(2,(window.devicePixelRatio||1)*s));W.R.setSize(1280,720,false);frame(t);}
addEventListener('resize',fit);fit();ui();showCtl();requestAnimationFrame(loop);
{const h=decodeURIComponent(location.hash.slice(1));const pg=PAGES.find(p=>p.id===h);if(pg)seek(pg.t0+0.01);}
const _frame=frame;frame=function(tt){const cur=PAGES.find(p=>tt>=p.t0&&tt<p.t1);ensureInit(cur||PAGES[PAGES.length-1]);if(cur!==lastPage){lastPage=cur;W.ORB.yaw=0;W.ORB.pitch=0;}_frame(tt);};
setTimeout(bgInit,500);
window.DBG={seek,get TOTAL(){return TOTAL},PAGES,get t(){return t},ALL};
